<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Purrwood paw and question-mark icon</title>
  <desc id="desc">A full cream and ginger cat paw reaches diagonally from the right side toward the center. Its pink-orange toe beans face upward, with a dark purple question mark above it on a soft lavender background.</desc>
  <defs>
    <linearGradient id="background" x1="110" y1="72" x2="928" y2="970" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E0FF"/>
      <stop offset=".52" stop-color="#CBB8EE"/>
      <stop offset="1" stop-color="#A988D0"/>
    </linearGradient>
    <linearGradient id="fur" x1="512" y1="304" x2="975" y2="786" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset=".7" stop-color="#FFF5E8"/>
      <stop offset="1" stop-color="#F7DEBF"/>
    </linearGradient>
    <linearGradient id="ginger" x1="620" y1="430" x2="993" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C184"/>
      <stop offset="1" stop-color="#E99B62"/>
    </linearGradient>
    <linearGradient id="bean" x1="490" y1="370" x2="693" y2="667" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5AA94"/>
      <stop offset="1" stop-color="#DC765F"/>
    </linearGradient>
    <filter id="pawShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="-16" dy="28" stdDeviation="23" flood-color="#57377B" flood-opacity=".28"/>
    </filter>
  </defs>

